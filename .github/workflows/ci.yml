name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # ---------------------------------------------------------------------------
  # Full test suite under ASan + UBSan on Linux and macOS. tests/meson.build
  # builds every strategy (bitwise / nibble / byte), the 16-bit-MAU
  # simulation, and an assertions-disabled variant, so one `meson test`
  # exercises every engine path.
  # ---------------------------------------------------------------------------
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitize: address,undefined
          - os: macos-latest
            sanitize: address

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson and Ninja
        run: python -m pip install --upgrade meson ninja

      - name: Configure (debug + tests)
        run: meson setup build --buildtype=debug -Dbuild_tests=true -Db_sanitize=${{ matrix.sanitize }}

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-${{ matrix.os }}
          path: build/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # Compile the library for every strategy x width-enable combination, with
  # warnings as errors. Locks in that each width builds in isolation (e.g.
  # CRC-32 only, CRC-8 only) and that no engine assumes a sibling width is
  # present.
  # ---------------------------------------------------------------------------
  config-matrix:
    name: "Config (${{ matrix.strategy }} / ${{ matrix.widths }})"
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        strategy:
          [UCRC_STRATEGY_BITWISE, UCRC_STRATEGY_NIBBLE, UCRC_STRATEGY_BYTE]
        widths:
          - "-DUCRC_ENABLE_CRC8=1 -DUCRC_ENABLE_CRC16=0 -DUCRC_ENABLE_CRC32=0"
          - "-DUCRC_ENABLE_CRC8=0 -DUCRC_ENABLE_CRC16=1 -DUCRC_ENABLE_CRC32=0"
          - "-DUCRC_ENABLE_CRC8=0 -DUCRC_ENABLE_CRC16=0 -DUCRC_ENABLE_CRC32=1"
          - "-DUCRC_ENABLE_CRC8=1 -DUCRC_ENABLE_CRC16=1 -DUCRC_ENABLE_CRC32=1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson and Ninja
        run: python -m pip install --upgrade meson ninja

      - name: Configure (release, werror, forced config)
        run: >
          meson setup build
          --buildtype=release
          -Dbuild_tests=false
          -Dwerror=true
          "-Dc_args=-DUCRC_STRATEGY=${{ matrix.strategy }} ${{ matrix.widths }}"

      - name: Build
        run: meson compile -C build

  # ---------------------------------------------------------------------------
  # Cross-compile smoke for a bare-metal embedded target (Cortex-M0, no libc
  # startup). Verifies the library sources compile clean with an embedded
  # toolchain and freestanding flags. The 16-bit-MAU path is exercised
  # logically by the simulation in the `test` job.
  # ---------------------------------------------------------------------------
  cross-compile:
    name: "Cross-compile (arm-none-eabi)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        run: sudo apt-get update -q && sudo apt-get install -y gcc-arm-none-eabi

      - name: Compile library sources
        run: >
          arm-none-eabi-gcc -std=c11 -Wall -Wextra -Werror
          -mcpu=cortex-m0 -mthumb -ffreestanding -Os
          -Iinclude -I.
          -c src/ucrc.c src/ucrc_tables.c

  # ---------------------------------------------------------------------------
  # Enforce clang-format on hand-written sources. The generated table file
  # carries its own `clang-format off` guard and is verified by the
  # `tables-up-to-date` test instead, so it is excluded here.
  # ---------------------------------------------------------------------------
  format:
    name: "clang-format"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update -q && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          files=$(git ls-files '*.c' '*.h' | grep -v 'src/ucrc_tables.c')
          clang-format --dry-run --Werror $files

  # ---------------------------------------------------------------------------
  # Build the Doxygen + Sphinx/Breathe documentation so API-doc drift is
  # caught in CI rather than at release time.
  # ---------------------------------------------------------------------------
  docs:
    name: "Docs build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update -q && sudo apt-get install -y doxygen

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Build HTML docs
        run: make -C docs/sphinx html

      - name: Upload docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html/

  # ---------------------------------------------------------------------------
  # Verify the library compiles cleanly in release mode (no tests, no
  # sanitizers) - the configuration a downstream project would use.
  # ---------------------------------------------------------------------------
  release-build:
    name: Release build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson and Ninja
        run: python -m pip install --upgrade meson ninja

      - name: Configure (release)
        run: meson setup build --buildtype=release -Dbuild_tests=false

      - name: Build
        run: meson compile -C build

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson, Ninja and gcovr
        run: python -m pip install --upgrade meson ninja gcovr

      - name: Configure (coverage)
        run: meson setup build --buildtype=debug -Dbuild_tests=true -Db_coverage=true

      - name: Build
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --verbose

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          gcovr \
            --root . \
            --filter 'src/' \
            --filter 'include/' \
            --merge-mode-functions=separate \
            --html-details coverage-report/index.html \
            --txt coverage-report/summary.txt \
            --print-summary \
            --fail-under-line 80 \
            --fail-under-branch 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
