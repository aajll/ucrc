name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Full test suite under ASan + UBSan. tests/meson.build
  # builds every strategy (bitwise / nibble / byte), the 16-bit-MAU
  # simulation, and an assertion-recording variant, so one `meson test`
  # exercises every engine path.
  # ---------------------------------------------------------------------------
  test:
    name: "Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install Meson and Ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (debug + tests)
        run: meson setup build --buildtype=debug -Dbuild_tests=true -Db_sanitize=address,undefined

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog
          path: build/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # Compile the library for every strategy x width-enable combination, with
  # warnings as errors. Locks in that each width builds in isolation (e.g.
  # CRC-32 only, CRC-8 only) and that no engine assumes a sibling width is
  # present.
  # ---------------------------------------------------------------------------
  config-matrix:
    name: "Config (${{ matrix.strategy }} / ${{ matrix.widths }})"
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        strategy:
          [UCRC_STRATEGY_BITWISE, UCRC_STRATEGY_NIBBLE, UCRC_STRATEGY_BYTE]
        widths:
          - "-DUCRC_ENABLE_CRC8=1 -DUCRC_ENABLE_CRC16=0 -DUCRC_ENABLE_CRC32=0"
          - "-DUCRC_ENABLE_CRC8=0 -DUCRC_ENABLE_CRC16=1 -DUCRC_ENABLE_CRC32=0"
          - "-DUCRC_ENABLE_CRC8=0 -DUCRC_ENABLE_CRC16=0 -DUCRC_ENABLE_CRC32=1"
          - "-DUCRC_ENABLE_CRC8=1 -DUCRC_ENABLE_CRC16=1 -DUCRC_ENABLE_CRC32=1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install Meson and Ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (release, werror, forced config)
        run: >
          meson setup build
          --buildtype=release
          -Dbuild_tests=false
          -Dwerror=true
          "-Dc_args=-DUCRC_STRATEGY=${{ matrix.strategy }} ${{ matrix.widths }}"

      - name: Build
        run: meson compile -C build

  # ---------------------------------------------------------------------------
  # Cross-compile smoke for a bare-metal embedded target (Cortex-M0, no libc
  # startup). Verifies the library sources compile clean with an embedded
  # toolchain and freestanding flags. The 16-bit-MAU path is exercised
  # logically by the simulation in the `test` job.
  # ---------------------------------------------------------------------------
  cross-compile:
    name: "Cross-compile (arm-none-eabi)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        run: sudo apt-get update -q && sudo apt-get install -y gcc-arm-none-eabi

      - name: Compile library sources
        run: >
          arm-none-eabi-gcc -std=c11 -Wall -Wextra -Werror
          -mcpu=cortex-m0 -mthumb -ffreestanding -Os
          -Iinclude -I.
          -c src/ucrc.c src/ucrc_tables.c

  # ---------------------------------------------------------------------------
  # Formatting, with the clang-format release pinned in scripts/format.sh. The
  # generated table file carries its own `clang-format off` guard and is
  # verified by the `tables-up-to-date` test.
  # ---------------------------------------------------------------------------
  format:
    name: "clang-format"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Check formatting
        run: scripts/format.sh

  # ---------------------------------------------------------------------------
  # Verify the library compiles cleanly in release mode (no tests, no
  # sanitizers) - the configuration a downstream project would use.
  # ---------------------------------------------------------------------------
  release-build:
    name: Release build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install Meson and Ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (release)
        run: meson setup build --buildtype=release -Dbuild_tests=false

      - name: Build
        run: meson compile -C build

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install Meson, Ninja and gcovr
        run: uv tool install meson && uv tool install ninja && uv tool install gcovr

      - name: Configure (coverage)
        run: meson setup build --buildtype=debug -Dbuild_tests=true -Db_coverage=true

      - name: Build
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --verbose

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          gcovr \
            --root . \
            --filter 'src/' \
            --filter 'include/' \
            --merge-mode-functions=separate \
            --html-details coverage-report/index.html \
            --txt coverage-report/summary.txt \
            --print-summary \
            --fail-under-line 100 \
            --fail-under-branch 100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

  # ---------------------------------------------------------------------------
  # Cross-build the library with the TI C2000 code generation tools, where
  # CHAR_BIT is 16, under both object formats with warnings as errors.
  # ---------------------------------------------------------------------------
  c2000:
    name: "TI C2000 (CGT ${{ matrix.cgt }})"
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - cgt: "22.6.2"
            sha256: "9773f338df7b7314bc459be2cd9d9bf329786da8de6531f8f2d3d38c1e9f5750"
          - cgt: "25.11.1"
            sha256: "2f3a978e24a53279c9796ad374c32b530fc58fd085fd71288597846fe169c821"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Cache TI C2000 CGT
        id: cache-cgt
        uses: actions/cache@v4
        with:
          path: ~/ti
          key: ti-cgt-c2000-${{ matrix.cgt }}

      - name: Install TI C2000 CGT
        if: steps.cache-cgt.outputs.cache-hit != 'true'
        run: |
          bin="ti_cgt_c2000_${{ matrix.cgt }}.LTS_linux-x64_installer.bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$bin" \
            "https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-xqxJ05PLfM/${{ matrix.cgt }}.LTS/$bin"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$bin" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/$bin"
          "$RUNNER_TEMP/$bin" --mode unattended --prefix "$HOME/ti"

      - name: Configure and build (COFF and EABI)
        run: |
          CGT="$HOME/ti/ti-cgt-c2000_${{ matrix.cgt }}.LTS"
          for abi in coffabi eabi; do
            cat > "c2000-$abi.ini" <<INI
          [binaries]
          c = '$CGT/bin/cl2000'
          ar = '$CGT/bin/ar2000'
          strip = '$CGT/bin/strip2000'

          [built-in options]
          c_args = ['-v28', '--float_support=fpu32', '--abi=$abi', '-I$CGT/include']

          [host_machine]
          system = 'bare-metal'
          cpu_family = 'c2000'
          cpu = 'c28x'
          endian = 'little'
          INI
            meson setup "build-$abi" --cross-file="c2000-$abi.ini" \
              -Dbuild_tests=false -Dwerror=true
            meson compile -C "build-$abi"
          done

  # ---------------------------------------------------------------------------
  # MISRA C:2023 analysis with misch. CI fails on any finding that is not
  # covered by misra-deviations.txt.
  # ---------------------------------------------------------------------------
  misra:
    name: "MISRA (misch)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      # Ubuntu 24.04 ships cppcheck 2.13, whose findings differ from current
      # releases. The Homebrew bottle is current; brew is preinstalled.
      - name: Install cppcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cppcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          cppcheck --version

      - name: Install meson, ninja and misch
        run: uv tool install meson && uv tool install ninja && uv tool install misch

      - name: Configure (compile database)
        run: meson setup build --buildtype=debug -Dbuild_tests=true

      - name: Analyse
        run: misch run -v
